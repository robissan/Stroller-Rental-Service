openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Reports that the API process is up. It does not read Little Roam bookings, which stay on the device.
      responses:
        "200":
          description: Process is up. Product data is not checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        detail:
          type: string
          description: States that this check does not read device-local bookings.
      required:
        - status
        - detail

