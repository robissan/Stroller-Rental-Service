kind = "mobile"
previewPath = "/"
title = "Little Roam"
description = "A stroller rental companion for traveling families and everyday adventures, with destination reservations, monthly plans, accessories, exchanges, and returns."
version = "1.0.0"
id = "artifacts/little-roam"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18315

[services.development]
run = "pnpm --filter @workspace/little-roam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-roam", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/little-roam", "run", "serve" ]

[services.env]
PORT = "18315"
BASE_PATH = "/"
